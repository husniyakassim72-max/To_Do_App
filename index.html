<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>

  <!-- Linking our external CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main container for the whole app -->
  <div class="app-container">

    <h1>My To-Do List</h1>

    <!-- Form area where user types a new task -->
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="What do you need to do?" />
      <button id="addBtn">Add</button>
    </div>

    <!-- Filter buttons: All / Completed / Pending -->
    <div class="filter-section">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
    </div>

    <!-- Tasks will be added here dynamically using JavaScript -->
    <ul id="taskList"></ul>

    <!-- Bottom bar: task counter + clear completed button -->
    <div class="footer-section">
      <span id="taskCounter">0 tasks left</span>
      <button id="clearBtn">Clear Completed</button>
    </div>

  </div>

  <!-- Linking our external JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
